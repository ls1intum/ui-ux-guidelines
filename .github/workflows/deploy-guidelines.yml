name: Deploy Guidelines to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'guidelines/**'
      - '.nvmrc'
      - '.github/workflows/deploy-guidelines.yml'
  workflow_dispatch:

permissions:
  contents: read

# Allow one deployment at a time, but let a running deployment finish
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: guidelines/package-lock.json

      - name: Install dependencies
        working-directory: guidelines
        run: npm ci

      - name: Typecheck
        working-directory: guidelines
        run: npm run typecheck

      - name: Build Docusaurus site
        working-directory: guidelines
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: guidelines/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
