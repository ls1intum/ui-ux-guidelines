name: Build Guidelines

# Builds and type-checks the site for pull requests without deploying it.
# The build fails on broken internal links and anchors.
on:
  pull_request:
    paths:
      - 'guidelines/**'
      - '.nvmrc'
      - '.github/workflows/build-guidelines.yml'
      - '.github/workflows/deploy-guidelines.yml'

permissions:
  contents: read

# Cancel outdated runs when new commits are pushed to the same pull request
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: guidelines/package-lock.json

      - name: Install dependencies
        working-directory: guidelines
        run: npm ci

      - name: Typecheck
        working-directory: guidelines
        run: npm run typecheck

      - name: Build Docusaurus site
        working-directory: guidelines
        run: npm run build
